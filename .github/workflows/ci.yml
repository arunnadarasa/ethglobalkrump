name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: node --check src/server.js
      - run: node --check src/agents/orchestrator.js
      - run: node --check src/settlement/vyperPolicy.js
      - run: node --check public/main.js

  vyper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r tests/titanoboa/requirements.txt
      - run: pytest tests/titanoboa -q
